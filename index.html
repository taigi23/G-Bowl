<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gメーター</title>
<style>
:root{--bg:#eef1f3;--fg:#12202e;--mut:#5f6f7e;--ring:#b8c2cb;--ball:#1f5eff;--peak:#e5484d;--panel:#fff;--btn:#12202e;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--fg:#e6edf3;--mut:#8ea0b1;--ring:#2c3d4d;--ball:#ffb020;--peak:#ff6b6b;--panel:#16232f;--btn:#e6edf3;--btnfg:#0f1a24}}
:root[data-theme="dark"]{--bg:#0f1a24;--fg:#e6edf3;--mut:#8ea0b1;--ring:#2c3d4d;--ball:#ffb020;--peak:#ff6b6b;--panel:#16232f;--btn:#e6edf3;--btnfg:#0f1a24}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:16px 16px 28px}
h1{font-size:1.1rem;margin:4px 0 12px}
canvas{display:block;width:100%;background:var(--panel)}
#c{aspect-ratio:1;border-radius:50%;touch-action:none}
#g{height:120px;border-radius:10px;margin-top:10px}
.big{text-align:center;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.big b{font-size:3.4rem;letter-spacing:-.02em}
.big span{color:var(--mut);margin-left:4px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;font-variant-numeric:tabular-nums}
.row div{background:var(--panel);border-radius:10px;padding:7px 8px}
.row small{display:block;color:var(--mut);font-size:.68rem}
.row strong{font-size:1rem}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button,select{font:inherit;font-size:.85rem;padding:9px 12px;border-radius:10px;border:1px solid var(--ring);background:var(--panel);color:var(--fg)}
button.p{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
button.on{border-color:var(--peak);color:var(--peak)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
#msg{color:var(--mut);font-size:.85rem;min-height:2.4em;margin:10px 0 0}
</style>
</head>
<body>
<main>
<h1>Gメーター</h1>
<canvas id="c" aria-label="Gボール"></canvas>
<div class="big"><b id="mag">0.00</b><span>G</span></div>
<div class="row">
<div><small>左右</small><strong id="gx">0.00</strong></div>
<div><small>前後</small><strong id="gy">0.00</strong></div>
<div><small>最大G</small><strong id="pk">0.00</strong></div>
<div><small>km/h</small><strong id="sp">--</strong></div>
</div>
<canvas id="g" aria-label="Gのグラフ"></canvas>
<div class="btns">
<button class="p" id="start">センサー開始</button>
<button id="cal">0点合わせ</button>
<button id="rec">記録開始</button>
<button id="csv">CSV保存</button>
<button id="snd" class="on">警告音 オン</button>
<select id="thr" aria-label="警告のしきい値"><option value="0.3">0.3G</option><option value="0.5" selected>0.5G</option><option value="0.7">0.7G</option><option value="1">1.0G</option></select>
<button id="gps">GPS開始</button>
<button id="rst">最大値を消す</button>
<button id="fx">左右反転</button>
<button id="fy">前後反転</button>
</div>
<p id="msg">「センサー開始」を押すと、傾きや加減速でボールが動きます。ボールをドラッグしても試せます。</p>
</main>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),gc=$('g'),gx=gc.getContext('2d');
const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let raw={x:0,y:0},off={x:0,y:0},sg={x:0,y:0},sx=ios?1:-1,sy=ios?-1:1,peak=0,trail=[],sensor=false,drag=null;
let hist=[],N=300,lastS=0,rec=false,log=[],t0=0,gps={sp:null,lat:null,lon:null},wid=null,ac=null,soundOn=true,lastBeep=0,thr=.5;
const msg=t=>{$('msg').textContent=t};
function fit(c,h){const d=devicePixelRatio||1,w=c.clientWidth,hh=h||w;c.width=Math.round(w*d);c.height=Math.round(hh*d);c.getContext('2d').setTransform(d,0,0,d,0,0)}
function size(){fit(cv);fit(gc,120)}
addEventListener('resize',size);size();
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null||a.y==null)return;
  if(!sensor){sensor=true;msg('センサー動作中。スマホを動かない状態にして「0点合わせ」を押すと基準になります。')}
  raw.x=a.x/9.81;raw.y=a.y/9.81;
}
async function start(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted'){msg('モーションセンサーの許可が必要です。');return}
    }
    addEventListener('devicemotion',onMotion);
    try{await navigator.wakeLock.request('screen')}catch(e){}
    msg('センサーの値を待っています…');
    setTimeout(()=>{if(!sensor)msg('センサーの値を取得できません。ボールのドラッグで試せます。')},1600);
  }catch(e){msg('センサーを開始できませんでした。')}
}
const calibrate=()=>{off={x:sx*raw.x,y:sy*raw.y}};
$('start').onclick=start;
$('cal').onclick=()=>{calibrate();msg('現在の姿勢を0に合わせました。')};
$('rst').onclick=()=>{peak=0;trail=[]};
$('fx').onclick=()=>{sx=-sx;calibrate()};
$('fy').onclick=()=>{sy=-sy;calibrate()};
$('thr').onchange=e=>{thr=+e.target.value};
$('snd').onclick=e=>{soundOn=!soundOn;e.target.textContent='警告音 '+(soundOn?'オン':'オフ');e.target.classList.toggle('on',soundOn)};
$('rec').onclick=e=>{
  rec=!rec;e.target.classList.toggle('on',rec);
  if(rec){log=[];t0=performance.now();e.target.textContent='記録停止';msg('記録中です（1秒に10回）。')}
  else{e.target.textContent='記録開始';msg('記録を止めました（'+log.length+'件）。「CSV保存」で保存できます。')}
};
$('csv').onclick=()=>{
  if(!log.length){msg('保存するログがありません。先に「記録開始」を押してください。');return}
  const f=v=>v==null?'':(typeof v==='number'?+v.toFixed(5):v);
  const t='秒,左右G,前後G,合成G,km/h,緯度,経度\n'+log.map(r=>r.map(f).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));
  a.download='gmeter-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.csv';
  document.body.appendChild(a);a.click();a.remove();
};
$('gps').onclick=e=>{
  if(wid!=null){navigator.geolocation.clearWatch(wid);wid=null;gps={sp:null,lat:null,lon:null};e.target.textContent='GPS開始';e.target.classList.remove('on');return}
  if(!navigator.geolocation){msg('この環境ではGPSを使えません。');return}
  wid=navigator.geolocation.watchPosition(p=>{const s=p.coords.speed;gps={sp:s==null?null:s*3.6,lat:p.coords.latitude,lon:p.coords.longitude}},()=>msg('位置情報を取得できません。位置情報の許可を確認してください。'),{enableHighAccuracy:true,maximumAge:0});
  e.target.textContent='GPS停止';e.target.classList.add('on');
};
function beep(){
  if(!ac||!soundOn)return;const n=performance.now();if(n-lastBeep<500)return;lastBeep=n;
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12);
}
function pt(e){const r=cv.getBoundingClientRect(),R=r.width/2;return{x:(e.clientX-r.left-R)/R,y:(e.clientY-r.top-R)/R}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag=pt(e)});
cv.addEventListener('pointermove',e=>{if(drag)drag=pt(e)});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null}));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw(){
  const w=cv.clientWidth,R=w/2,k=R*.94,ring=css('--ring'),ball=css('--ball'),pc=css('--peak');
  ctx.clearRect(0,0,w,w);
  ctx.strokeStyle=ring;ctx.lineWidth=1;
  for(let i=1;i<=4;i++){ctx.beginPath();ctx.arc(R,R,k*i/4,0,7);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(R,R*.06);ctx.lineTo(R,w-R*.06);ctx.moveTo(R*.06,R);ctx.lineTo(w-R*.06,R);ctx.stroke();
  ctx.fillStyle=ring;ctx.font='11px system-ui';ctx.textAlign='left';
  [.25,.5,.75,1].forEach(g=>ctx.fillText(g+'G',R+4,R-k*g-3));
  if(peak>0){
    const pr=Math.min(peak,1)*k;
    ctx.strokeStyle=pc;ctx.lineWidth=2;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.arc(R,R,pr,0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=pc;ctx.textAlign='center';ctx.fillText('最大 '+peak.toFixed(2)+'G',R,Math.min(R+pr+14,w-4));
  }
  trail.forEach((p,i)=>{ctx.globalAlpha=i/trail.length*.35;ctx.fillStyle=ball;ctx.beginPath();ctx.arc(R+p.x*k,R+p.y*k,R*.025,0,7);ctx.fill()});
  ctx.globalAlpha=1;
  let bx=sg.x,by=sg.y,l=Math.hypot(bx,by);
  if(l>1){bx/=l;by/=l}
  ctx.fillStyle=ball;ctx.beginPath();ctx.arc(R+bx*k,R+by*k,R*.07,0,7);ctx.fill();
}
function graph(){
  const w=gc.clientWidth,h=120,y0=h/2,sc=y0/1.2,ring=css('--ring'),mut=css('--mut'),ball=css('--ball');
  gx.clearRect(0,0,w,h);
  gx.strokeStyle=ring;gx.lineWidth=1;
  gx.beginPath();gx.moveTo(0,y0);gx.lineTo(w,y0);gx.stroke();
  gx.setLineDash([4,4]);gx.beginPath();gx.moveTo(0,y0-thr*sc);gx.lineTo(w,y0-thr*sc);gx.stroke();gx.setLineDash([]);
  const line=(key,col,lw)=>{
    gx.strokeStyle=col;gx.lineWidth=lw;gx.beginPath();
    hist.forEach((p,i)=>{const X=w-(hist.length-1-i)/(N-1)*w,Y=y0-p[key]*sc;i?gx.lineTo(X,Y):gx.moveTo(X,Y)});
    gx.stroke();
  };
  line('x',mut,1);line('y',mut,1);line('m',ball,2);
  gx.fillStyle=mut;gx.font='10px system-ui';gx.textAlign='left';gx.fillText('過去30秒　細線：左右・前後　太線：合成G　点線：警告ライン',4,11);
}
function loop(now){
  let tx=0,ty=0;
  if(drag){tx=drag.x;ty=drag.y}
  else if(sensor){tx=sx*raw.x-off.x;ty=sy*raw.y-off.y}
  sg.x+=(tx-sg.x)*.2;sg.y+=(ty-sg.y)*.2;
  const m=Math.hypot(sg.x,sg.y);
  if(m>peak)peak=m;
  if(m>thr)beep();
  trail.push({x:Math.max(-1,Math.min(1,sg.x)),y:Math.max(-1,Math.min(1,sg.y))});
  if(trail.length>40)trail.shift();
  if(now-lastS>=100){
    lastS=now;
    hist.push({x:sg.x,y:-sg.y,m});if(hist.length>N)hist.shift();
    if(rec)log.push([(now-t0)/1000,sg.x,-sg.y,m,gps.sp,gps.lat,gps.lon]);
  }
  $('mag').textContent=m.toFixed(2);
  $('gx').textContent=sg.x.toFixed(2);
  $('gy').textContent=(-sg.y).toFixed(2);
  $('pk').textContent=peak.toFixed(2);
  $('sp').textContent=gps.sp==null?'--':Math.round(gps.sp);
  draw();graph();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
