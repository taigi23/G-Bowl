<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gメーター</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#eef1f3;--fg:#12202e;--mut:#5f6f7e;--ring:#b8c2cb;--ball:#1f5eff;--peak:#e5484d;--panel:#fff;--btn:#12202e;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--fg:#e6edf3;--mut:#8ea0b1;--ring:#2c3d4d;--ball:#ffb020;--peak:#ff6b6b;--panel:#16232f;--btn:#e6edf3;--btnfg:#0f1a24}}
:root[data-theme="dark"]{--bg:#0f1a24;--fg:#e6edf3;--mut:#8ea0b1;--ring:#2c3d4d;--ball:#ffb020;--peak:#ff6b6b;--panel:#16232f;--btn:#e6edf3;--btnfg:#0f1a24}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;max-width:460px;margin:0 auto;padding:10px 16px 0}
nav{display:flex;gap:6px}
.in,main{max-width:460px;margin:0 auto;padding:12px 16px 28px}
h2{font-size:.95rem;margin:18px 0 6px}
#c,#vc,#g,#vg{display:block;width:100%;background:var(--panel)}
#c,#vc{aspect-ratio:1;border-radius:50%;touch-action:none}
#vc{width:min(100%,320px);margin:8px auto}
.bw{position:relative}
.corner{position:absolute;left:0;bottom:0;display:flex;flex-direction:column;gap:6px}
.corner button{padding:6px 9px;font-size:.75rem}
#g,#vg{height:120px;border-radius:10px;margin-top:10px}
#mp,#vm{height:300px;border-radius:10px;margin-top:10px;background:var(--panel);z-index:0;overflow:hidden}
.mcap{color:var(--mut);font-size:.75rem;margin:4px 2px 0}
.mempty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mut);font-size:.85rem;text-align:center;padding:0 12px}
.big{text-align:center;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.big b{font-size:3.4rem;letter-spacing:-.02em}
.big span{color:var(--mut);margin-left:4px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;font-variant-numeric:tabular-nums}
.row div{background:var(--panel);border-radius:10px;padding:7px 8px}
.row small{display:block;color:var(--mut);font-size:.68rem}
.row strong{font-size:1rem}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button,select{font:inherit;font-size:.85rem;padding:9px 12px;border-radius:10px;border:1px solid var(--ring);background:var(--panel);color:var(--fg)}
button.p,.tab.on{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
button.on{border-color:var(--peak);color:var(--peak)}
.tab{border-radius:20px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
#msg{color:var(--mut);font-size:.85rem;min-height:2.4em;margin:10px 0 0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:10px 12px;margin:6px 0}
li small{display:block;color:var(--mut)}
#vw{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5;padding-top:env(safe-area-inset-top,0px)}
#vr{text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
input[type=range]{width:100%}
dialog{border:1px solid var(--ring);border-radius:16px;background:var(--panel);color:var(--fg);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--ring)}
.set input[type=checkbox]{width:22px;height:22px}
.set input[type=range]{width:45%}
</style>
</head>
<body>
<header>
<nav><button class="tab on" data-t="m">メーター</button><button class="tab" data-t="l">ログ</button></nav>
<button id="gear" aria-label="設定">⚙ 設定</button>
</header>
<main>
<section id="pm">
<div class="bw"><canvas id="c" aria-label="Gボール"></canvas><div class="corner"><button id="cal">0点合わせ</button><button id="rst">最大値を消す</button></div></div>
<div class="big"><b id="mag">0.00</b><span>G</span></div>
<div class="row">
<div><small>左右</small><strong id="gx">0.00</strong></div>
<div><small>前後</small><strong id="gy">0.00</strong></div>
<div><small>最大G</small><strong id="pk">0.00</strong></div>
<div><small>km/h</small><strong id="sp">--</strong></div>
</div>
<div class="btns">
<button class="p" id="start">開始</button>
<button id="rec">記録開始</button>
</div>
</section>
<section id="pl" hidden>
<canvas id="g" aria-label="Gのグラフ"></canvas>
<div id="mp" aria-label="走行マップ"></div>
<p class="mcap">緑の丸＝開始　線の色＝G（青→緑→黄→赤）　ピンチで拡大・縮小</p>
<div class="btns"><button id="mfol">現在地</button><button id="mall">全体表示</button><button id="clr">軌跡を消す</button></div>
<h2>保存したログ</h2>
<div class="btns" style="margin:0 0 6px"><button id="imp">CSVを読み込む</button><input type="file" id="impf" accept=".csv,text/csv,text/plain" hidden></div>
<ul id="list"></ul>
</section>
<p id="msg">「開始」を押すと、センサーとGPSが動き出し、傾きや加減速でボールが動きます。ボールをドラッグしても試せます。</p>
</main>
<div id="vw" hidden><div class="in">
<div class="btns" style="align-items:center"><button id="vx">← 戻る</button><b id="vn"></b></div>
<canvas id="vc" aria-label="再生中のGボール"></canvas>
<p id="vr"></p>
<div class="btns"><button class="p" id="vp">▶ 再生</button><select id="vs" aria-label="再生速度"><option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select></div>
<input type="range" id="vk" min="0" max="0" value="0" step="1" aria-label="再生位置">
<div id="vmw"><div id="vm" aria-label="ログの走行マップ"></div>
<p class="mcap">緑の丸＝開始　青の丸＝再生位置　線の色＝G（青→緑→黄→赤）　ピンチで拡大・縮小</p>
<div class="btns"><button id="vall">全体表示</button></div></div>
<p class="mcap" id="vnogps" hidden>このログにはGPSの位置がないので、地図は出ません。記録するときは「開始」を押してGPSも動かしてください。</p>
<canvas id="vg" aria-label="ログのグラフ"></canvas>
</div></div>
<dialog id="st">
<h2 style="margin-top:0">設定</h2>
<div class="set"><span>警告音</span><span><select id="thr" aria-label="警告のしきい値"><option value="0.3">0.3G</option><option value="0.5">0.5G</option><option value="0.7">0.7G</option><option value="1">1.0G</option></select> <input type="checkbox" id="snd" aria-label="警告音"></span></div>
<div class="set"><span>左右反転</span><input type="checkbox" id="fx"></div>
<div class="set"><span>前後反転</span><input type="checkbox" id="fy"></div>
<div class="set"><span>ローパス <b><span id="fcv">5</span> Hz</b></span><input type="range" id="fc" min="0.5" max="20" step="0.5" aria-label="カットオフ周波数"></div>
<div class="btns"><button class="p" id="stx">閉じる</button></div>
</dialog>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),gc=$('g'),gx=gc.getContext('2d');
const vc=$('vc'),vcx=vc.getContext('2d'),vg=$('vg'),vgx=vg.getContext('2d');
const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const NICE=[.4,.8,1.2,2,4,8],nice=p=>NICE.find(v=>v>=Math.max(p*1.05,.3))||8;
let cfg={fc:5,thr:.5,snd:true,fx:false,fy:false,v:3};
const saveCfg=()=>{try{localStorage.setItem('gm-set',JSON.stringify(cfg))}catch(e){}};
try{const st=JSON.parse(localStorage.getItem('gm-set')||'{}')||{};if(st.v!==3){st.fy=false;st.v=3}Object.assign(cfg,st);saveCfg()}catch(e){}
const sxv=()=>(ios?1:-1)*(cfg.fx?-1:1),syv=()=>(ios?-1:1)*(cfg.fy?-1:1);
let raw={x:0,y:0},off={x:0,y:0},sg={x:0,y:0},peak=0,trail=[],sensor=false,drag=null,S=.4;
let curM=0,lastT=0,trk=[],env=new Array(72).fill(0),hist=[],N=300,lastS=0,rec=false,log=[],t0=0;
let gps={sp:null,lat:null,lon:null},wid=null,ac=null,lastBeep=0,V=null,saved=[];
try{saved=JSON.parse(localStorage.getItem('gm-logs')||'[]')}catch(e){}
const msg=t=>{$('msg').textContent=t};
function fit(c,h){const w=c.clientWidth;if(!w)return;const d=devicePixelRatio||1;c.width=Math.round(w*d);c.height=Math.round((h||w)*d);c.getContext('2d').setTransform(d,0,0,d,0,0)}
function size(){fit(cv);fit(gc,120);fit(vc);fit(vg,120);if(LM)LM.map.invalidateSize();if(VM)VM.map.invalidateSize()}
let LM=null,VM=null;
addEventListener('resize',size);size();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  $('pm').hidden=b.dataset.t!=='m';$('pl').hidden=b.dataset.t!=='l';
  if(b.dataset.t==='l')liveMap();
  size();
});
// settings
$('snd').checked=cfg.snd;$('fx').checked=cfg.fx;$('fy').checked=cfg.fy;$('thr').value=String(cfg.thr);$('fc').value=cfg.fc;$('fcv').textContent=cfg.fc;
$('gear').onclick=()=>{const d=$('st');d.showModal?d.showModal():d.setAttribute('open','')};
$('stx').onclick=()=>{const d=$('st');d.close?d.close():d.removeAttribute('open')};
$('snd').onchange=e=>{cfg.snd=e.target.checked;saveCfg()};
$('thr').onchange=e=>{cfg.thr=+e.target.value;saveCfg()};
$('fx').onchange=e=>{cfg.fx=e.target.checked;saveCfg();calibrate();mirror(true,false)};
$('fy').onchange=e=>{cfg.fy=e.target.checked;saveCfg();calibrate();mirror(false,true)};
// 反転したら、すでに描いたGの軌跡（点の尾・最大Gの輪郭・グラフ・記録中のログ）も同じ向きに反転する
function mirror(mx,my){
  if(mx){sg.x=-sg.x;trail.forEach(p=>{p.x=-p.x});hist.forEach(p=>{p.x=-p.x});log.forEach(r=>{r[1]=-r[1]})}
  if(my){sg.y=-sg.y;trail.forEach(p=>{p.y=-p.y});hist.forEach(p=>{p.y=-p.y});log.forEach(r=>{r[2]=-r[2]})}
  const n=env.length,ne=new Array(n).fill(0);
  env.forEach((v,i)=>{
    const a=i/n*2*Math.PI-Math.PI;let x=Math.cos(a),y=Math.sin(a);
    if(mx)x=-x;if(my)y=-y;
    const j=((Math.round((Math.atan2(y,x)+Math.PI)/(2*Math.PI)*n))%n+n)%n;
    if(v>ne[j])ne[j]=v;
  });
  env=ne;
}
$('fc').oninput=e=>{cfg.fc=+e.target.value;$('fcv').textContent=cfg.fc;saveCfg()};
// sensor
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null||a.y==null)return;
  if(!sensor){sensor=true;msg('センサー動作中。スマホを動かない状態にして「0点合わせ」を押すと基準になります。')}
  raw.x=a.x/9.81;raw.y=a.y/9.81;
}
let running=false,wl=null;
async function start(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted'){msg('モーションセンサーの許可が必要です。');return false}
    }
    addEventListener('devicemotion',onMotion);
    try{wl=await navigator.wakeLock.request('screen')}catch(e){}
    msg('センサーの値を待っています…');
    setTimeout(()=>{if(running&&!sensor)msg('センサーの値を取得できません。ボールのドラッグで試せます。')},1600);
    return true;
  }catch(e){msg('センサーを開始できませんでした。');return false}
}
function setRun(on){running=on;const b=$('start');b.textContent=on?'停止':'開始';b.classList.toggle('p',!on);b.classList.toggle('on',on)}
function stopAll(){removeEventListener('devicemotion',onMotion);sensor=false;raw={x:0,y:0};try{wl&&wl.release()}catch(e){}wl=null;stopGps();setRun(false);msg('停止しました。')}
const calibrate=()=>{off={x:sxv()*raw.x,y:syv()*raw.y}};
$('start').onclick=async()=>{
  if(running){stopAll();return}
  setRun(true);
  if(await start())startGps();else setRun(false);
};
$('cal').onclick=()=>{calibrate();msg('現在の姿勢を0に合わせました。')};
$('rst').onclick=()=>{peak=0;trail=[];env.fill(0)};
$('clr').onclick=()=>{trk=[];if(LM)clearTrack(LM)};
$('mfol').onclick=()=>{if(!LM)return;LM.follow=true;const p=trk[trk.length-1];if(p)LM.map.setView([p.la,p.lo],Math.max(LM.map.getZoom(),16))};
$('mall').onclick=()=>{if(LM)fitAll(LM,trk)};
// recording and saved logs
const persist=()=>{try{localStorage.setItem('gm-logs',JSON.stringify(saved));return true}catch(e){return false}};
function saveLog(){
  const q=(v,d)=>v==null?null:+v.toFixed(d);
  const rows=log.map(r=>[q(r[0],1),q(r[1],3),q(r[2],3),q(r[3],3),q(r[4],1),q(r[5],6),q(r[6],6)]);
  const name=new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const r=addLog(rows,name);
  msg(r.ok?'ログを保存しました（'+rows.length+'件）。「ログ」タブから再生できます。':'保存できませんでした（容量がいっぱいです）。古いログを削除してください。');
}
function addLog(rows,name){
  const L={id:Date.now(),name,dur:Math.round(rows[rows.length-1][0]),peak:+rows.reduce((a,r)=>Math.max(a,r[3]),0).toFixed(2),gps:rows.some(r=>r[5]!=null),rows};
  saved.unshift(L);
  if(persist()){renderList();return{L,ok:true}}
  saved.shift();return{L,ok:false};
}
function exportCsv(L){
  const f=v=>v==null?'':v;
  const t='秒,左右G,前後G,合成G,km/h,緯度,経度\n'+L.rows.map(r=>r.map(f).join(',')).join('\n');
  const d=new Date(L.id),p2=n=>String(n).padStart(2,'0');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));
  a.download='gmeter-'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'-'+p2(d.getHours())+p2(d.getMinutes())+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
function parseCsv(t){
  const n=v=>{const x=parseFloat(v);return isFinite(x)?x:null};
  const rows=[];
  t.split(/\r?\n/).forEach(l=>{
    const c=l.trim().split(',');if(c.length<3)return;
    const tt=n(c[0]),x=n(c[1]),y=n(c[2]);if(tt==null||x==null||y==null)return;
    const m=n(c[3]);
    rows.push([tt,x,y,m==null?Math.hypot(x,y):m,n(c[4]),n(c[5]),n(c[6])]);
  });
  return rows;
}
$('rec').onclick=e=>{
  if(!rec){rec=true;log=[];t0=performance.now();e.target.textContent='記録停止';e.target.classList.add('on');msg('記録中です（1秒に10回）。');return}
  rec=false;e.target.textContent='記録開始';e.target.classList.remove('on');
  if(!log.length){msg('記録が空でした。');return}
  if(confirm('記録を保存しますか？\n'+log.length+'件（約'+Math.round(log[log.length-1][0])+'秒）'))saveLog();else msg('記録を破棄しました。');
};
function renderList(){
  $('list').innerHTML=saved.length?saved.map(s=>'<li><div><b>'+s.name+'</b><small>'+s.dur+'秒　最大'+s.peak+'G'+(s.gps?'　GPSあり':'')+'</small></div><div class="btns" style="margin:0"><button data-a="p" data-id="'+s.id+'">再生</button><button data-a="c" data-id="'+s.id+'">CSV</button><button data-a="d" data-id="'+s.id+'">削除</button></div></li>').join(''):'<li><small>保存したログはまだありません。</small></li>';
}
$('list').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const L=saved.find(s=>s.id==b.dataset.id);if(!L)return;
  if(b.dataset.a==='p')openL(L);
  else if(b.dataset.a==='c')exportCsv(L);
  else if(confirm('このログを削除しますか？')){saved=saved.filter(s=>s.id!=b.dataset.id);persist();renderList()}
};
renderList();
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const rows=parseCsv((await f.text()).replace(/^﻿/,''));
    if(rows.length<2){msg('CSVから記録を読み取れませんでした。「秒,左右G,前後G,…」の形式のファイルを選んでください。');return}
    const r=addLog(rows,f.name.replace(/\.[^.]+$/,''));
    msg(r.ok?'CSVを読み込みました（'+rows.length+'件）。':'容量がいっぱいで保存はできませんが、再生はできます。');
    openL(r.L);
  }catch(err){msg('CSVを読み込めませんでした。')}
};
// gps
function stopGps(){if(wid!=null){navigator.geolocation.clearWatch(wid);wid=null}gps={sp:null,lat:null,lon:null}}
function startGps(){
  if(wid!=null)return;
  if(!navigator.geolocation){msg('この環境ではGPSを使えません。');return}
  wid=navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    gps={sp:c.speed==null?null:c.speed*3.6,lat:c.latitude,lon:c.longitude};
    if(c.accuracy<=100){
      const q={la:c.latitude,lo:c.longitude,m:curM};
      trk.push(q);curM=0;if(trk.length>20000)trk.shift();
      if(LM)liveAdd(q,trk[trk.length-2]);
    }
  },()=>msg('位置情報を取得できません。位置情報の許可を確認してください。'),{enableHighAccuracy:true,maximumAge:0});
}
function beep(){
  if(!ac||!cfg.snd)return;const n=performance.now();if(n-lastBeep<500)return;lastBeep=n;
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12);
}
function pt(e){const r=cv.getBoundingClientRect(),R=r.width/2;return{x:(e.clientX-r.left-R)/R,y:(e.clientY-r.top-R)/R}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag=pt(e)});
cv.addEventListener('pointermove',e=>{if(drag)drag=pt(e)});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null}));
// drawing
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function envAdd(en,x,y,m){const a=Math.atan2(y,x),b=Math.round((a+Math.PI)/(2*Math.PI)*72);for(let d=-3;d<=3;d++){const i=((b+d)%72+72)%72,v=m*Math.cos(d*Math.PI/12);if(v>en[i])en[i]=v}}
function drawBall(cvs,c,sc){
  const w=cvs.clientWidth;if(!w)return;
  const R=w/2,k=R*.94,S=sc.S,ring=css('--fg'),ball=css('--ball'),pc=css('--peak');
  c.clearRect(0,0,w,w);
  c.strokeStyle=ring;c.lineWidth=1.4;c.globalAlpha=.55;
  for(let i=1;i<=4;i++){c.beginPath();c.arc(R,R,k*i/4,0,7);c.stroke()}
  c.beginPath();c.moveTo(R,R*.06);c.lineTo(R,w-R*.06);c.moveTo(R*.06,R);c.lineTo(w-R*.06,R);c.stroke();
  c.globalAlpha=.9;c.fillStyle=ring;c.font='11px system-ui';c.textAlign='left';
  [.25,.5,.75,1].forEach(g=>c.fillText(+(S*g).toFixed(2)+'G',R+4,R-k*g-3));
  c.globalAlpha=1;
  if(sc.peak>.02){
    c.beginPath();
    sc.env.forEach((v,i)=>{const a=i/72*2*Math.PI-Math.PI,r=Math.min(v/S,1)*k,X=R+Math.cos(a)*r,Y=R+Math.sin(a)*r;i?c.lineTo(X,Y):c.moveTo(X,Y)});
    c.closePath();c.globalAlpha=.14;c.fillStyle=pc;c.fill();c.globalAlpha=1;
    c.strokeStyle=pc;c.lineWidth=2;c.stroke();
    const bi=sc.env.indexOf(Math.max(...sc.env)),ba=bi/72*2*Math.PI-Math.PI,br=Math.min(sc.env[bi]/S,1)*k+14;
    c.fillStyle=pc;c.textAlign='center';
    c.fillText('最大 '+sc.peak.toFixed(2)+'G',Math.max(34,Math.min(w-34,R+Math.cos(ba)*br)),Math.max(12,Math.min(w-6,R+Math.sin(ba)*br)));
  }
  sc.trail.forEach((p,i)=>{c.globalAlpha=i/sc.trail.length*.35;c.fillStyle=ball;c.beginPath();c.arc(R+p.x/S*k,R+p.y/S*k,R*.025,0,7);c.fill()});
  c.globalAlpha=1;
  let bx=sc.x/S,by=sc.y/S,l=Math.hypot(bx,by);
  if(l>1){bx/=l;by/=l}
  c.fillStyle=ball;c.beginPath();c.arc(R+bx*k,R+by*k,R*.07,0,7);c.fill();
}
function drawGraph(c,w,pts,full,cur){
  const h=120,y0=h/2,sc=y0/1.2,ring=css('--ring'),mut=css('--mut'),ball=css('--ball'),n=pts.length;
  c.clearRect(0,0,w,h);c.strokeStyle=ring;c.lineWidth=1;
  c.beginPath();c.moveTo(0,y0);c.lineTo(w,y0);c.stroke();
  c.setLineDash([4,4]);c.beginPath();c.moveTo(0,y0-cfg.thr*sc);c.lineTo(w,y0-cfg.thr*sc);c.stroke();c.setLineDash([]);
  const px=i=>full?i/Math.max(n-1,1)*w:w-(n-1-i)/(N-1)*w;
  const line=(k,col,lw)=>{c.strokeStyle=col;c.lineWidth=lw;c.beginPath();pts.forEach((p,i)=>{const Y=y0-p[k]*sc;i?c.lineTo(px(i),Y):c.moveTo(px(i),Y)});c.stroke()};
  line('x',mut,1);line('y',mut,1);line('m',ball,2);
  if(full&&cur!=null){c.strokeStyle=css('--fg');c.lineWidth=1.5;c.beginPath();c.moveTo(px(cur),0);c.lineTo(px(cur),h);c.stroke()}
  c.fillStyle=mut;c.font='10px system-ui';c.textAlign='left';
  c.fillText(full?'細線：左右・前後　太線：合成G　縦線：再生位置':'過去30秒　細線：左右・前後　太線：合成G　点線：警告ライン',4,11);
}
const gcol=m=>'hsl('+(220-220*Math.min(m/.6,1))+',100%,36%)';
function makeMap(el){
  if(!window.L){el.innerHTML='<div class="mempty">地図を読み込めませんでした。ネットにつながっているか確認して、ページを再読み込みしてください。</div>';return null}
  const map=L.map(el,{preferCanvas:true,zoomControl:true,attributionControl:true}).setView([35.68,139.76],5);
  let te=0;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'})
    .on('tileerror',()=>{if(++te===3)msg('地図の画像を読み込めません。電波の状態を確認してください。')}).addTo(map);
  map.createPane('cas').style.zIndex=410;
  map.createPane('trk').style.zIndex=420;
  map.createPane('mrk').style.zIndex=430;
  const M={map,cas:L.layerGroup().addTo(map),grp:L.layerGroup().addTo(map),
    start:L.circleMarker([0,0],{pane:'mrk',radius:8,color:'#fff',weight:3,fillColor:'#16a34a',fillOpacity:1}),
    cur:L.circleMarker([0,0],{pane:'mrk',radius:9,color:'#fff',weight:3,fillColor:'#1d4ed8',fillOpacity:1}),
    follow:true};
  map.on('dragstart',()=>{M.follow=false});
  return M;
}
function seg(M,a,b){
  const ll=[[a.la,a.lo],[b.la,b.lo]];
  L.polyline(ll,{pane:'cas',color:'#fff',weight:11,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(M.cas);
  L.polyline(ll,{pane:'trk',color:gcol(b.m),weight:6,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(M.grp);
}
function clearTrack(M){M.cas.clearLayers();M.grp.clearLayers();M.cur.remove();M.start.remove()}
function fitAll(M,tr){
  if(!tr.length)return;
  if(tr.length===1){M.map.setView([tr[0].la,tr[0].lo],16);return}
  M.map.fitBounds(L.latLngBounds(tr.map(p=>[p.la,p.lo])),{padding:[24,24],maxZoom:17});
}
function liveMap(){
  if(LM||!(LM=makeMap($('mp'))))return;
  for(let i=1;i<trk.length;i++)seg(LM,trk[i-1],trk[i]);
  if(trk.length){LM.start.setLatLng([trk[0].la,trk[0].lo]).addTo(LM.map);const p=trk[trk.length-1];LM.cur.setLatLng([p.la,p.lo]).addTo(LM.map);fitAll(LM,trk)}
}
function liveAdd(q,prev){
  if(prev)seg(LM,prev,q);else{LM.start.setLatLng([q.la,q.lo]).addTo(LM.map);LM.map.setView([q.la,q.lo],16)}
  LM.cur.setLatLng([q.la,q.lo]).addTo(LM.map);
  if(LM.follow&&!$('pl').hidden)LM.map.panTo([q.la,q.lo],{animate:false});
}
// viewer
function openL(L){
  if(!L||!L.rows.length)return;
  const rows=L.rows;let mx=0,last=null;const tr=[],cur=[];
  rows.forEach(r=>{
    mx=Math.max(mx,r[3]);
    if(r[5]!=null&&r[6]!=null&&(!last||last.la!==r[5]||last.lo!==r[6])){last={la:r[5],lo:r[6],m:mx};tr.push(last);mx=0}
    cur.push(last);
  });
  V={rows,pts:rows.map(r=>({x:r[1],y:r[2],m:r[3]})),trk:tr,cur,i:-1,vt:rows[0][0],play:false,sp:+$('vs').value,env:new Array(72).fill(0),peak:0};
  $('vn').textContent=L.name;$('vk').max=rows.length-1;$('vk').value=0;$('vp').textContent='▶ 再生';
  $('vw').hidden=false;
  const has=tr.length>0;$('vmw').hidden=!has;$('vnogps').hidden=has;
  if(has&&!VM)VM=makeMap($('vm'));
  size();vseek(0);
  if(has&&VM){
    clearTrack(VM);V.mk=null;
    for(let i=1;i<tr.length;i++)seg(VM,tr[i-1],tr[i]);
    if(tr.length){VM.start.setLatLng([tr[0].la,tr[0].lo]).addTo(VM.map);fitAll(VM,tr)}
  }
}
$('vall').onclick=()=>{if(V&&VM)fitAll(VM,V.trk)};
function vseek(i){
  if(i<V.i){V.env.fill(0);V.peak=0;V.i=-1}
  for(let j=V.i+1;j<=i;j++){const r=V.rows[j];if(r[3]>V.peak)V.peak=r[3];if(r[3]>.02)envAdd(V.env,r[1],-r[2],r[3])}
  V.i=i;
}
$('vx').onclick=()=>{$('vw').hidden=true;V=null};
$('vp').onclick=()=>{
  if(!V)return;
  if(!V.play&&V.i>=V.rows.length-1){vseek(0);V.vt=V.rows[0][0]}
  V.play=!V.play;$('vp').textContent=V.play?'⏸ 一時停止':'▶ 再生';
};
$('vs').onchange=e=>{if(V)V.sp=+e.target.value};
$('vk').oninput=e=>{if(V){const i=+e.target.value;vseek(i);V.vt=V.rows[i][0]}};
function vframe(dt){
  const n=V.rows.length;
  if(V.play){
    V.vt+=dt*V.sp;let i=V.i;
    while(i<n-1&&V.rows[i+1][0]<=V.vt)i++;
    if(i!==V.i){vseek(i);$('vk').value=i}
    if(i>=n-1){V.play=false;$('vp').textContent='▶ 再生'}
  }
  const r=V.rows[V.i],tm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  vseek(V.i);
  drawBall(vc,vcx,{x:r[1],y:-r[2],S:nice(V.peak),peak:V.peak,env:V.env,trail:V.rows.slice(Math.max(0,V.i-39),V.i+1).map(q=>({x:q[1],y:-q[2]}))});
  if(vg.clientWidth)drawGraph(vgx,vg.clientWidth,V.pts,true,V.i);
  const cp=V.cur[V.i];
  if(VM&&cp&&cp!==V.mk){V.mk=cp;VM.cur.setLatLng([cp.la,cp.lo]).addTo(VM.map);if(V.play&&!VM.map.getBounds().contains([cp.la,cp.lo]))VM.map.panTo([cp.la,cp.lo])}
  $('vr').textContent=tm(r[0])+' / '+tm(V.rows[n-1][0])+'　'+r[3].toFixed(2)+'G'+(r[4]==null?'':'　'+Math.round(r[4])+'km/h');
}
// main loop
function loop(now){
  let tx=0,ty=0;
  if(drag){tx=drag.x*S*.95;ty=drag.y*S*.95}
  else if(sensor){tx=sxv()*raw.x-off.x;ty=syv()*raw.y-off.y}
  const dt=Math.min(Math.max((now-lastT)/1000,.001),.1);lastT=now;
  const al=dt/(1/(2*Math.PI*cfg.fc)+dt);
  sg.x+=(tx-sg.x)*al;sg.y+=(ty-sg.y)*al;
  const m=Math.hypot(sg.x,sg.y);
  if(m>peak)peak=m;
  curM=Math.max(curM,m);
  S=nice(peak);
  if(m>.02)envAdd(env,sg.x,sg.y,m);
  if(m>cfg.thr)beep();
  trail.push({x:sg.x,y:sg.y});
  if(trail.length>40)trail.shift();
  if(now-lastS>=100){
    lastS=now;
    hist.push({x:sg.x,y:-sg.y,m});if(hist.length>N)hist.shift();
    if(rec)log.push([(now-t0)/1000,sg.x,-sg.y,m,gps.sp,gps.lat,gps.lon]);
  }
  if(!$('pm').hidden){
    $('mag').textContent=m.toFixed(2);
    $('gx').textContent=sg.x.toFixed(2);
    $('gy').textContent=(-sg.y).toFixed(2);
    $('pk').textContent=peak.toFixed(2);
    $('sp').textContent=gps.sp==null?'--':Math.round(gps.sp);
    drawBall(cv,ctx,{x:sg.x,y:sg.y,S,peak,env,trail});
  }
  if(!$('pl').hidden){
    if(gc.clientWidth)drawGraph(gx,gc.clientWidth,hist,false);
  }
  if(V&&!$('vw').hidden)vframe(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
